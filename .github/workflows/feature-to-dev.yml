name: 1. Promote feature → dev

on:
  workflow_dispatch:
    inputs:
      feature_branch:
        description: "Feature branch name (example: feature/edp_changes_ravi)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Validate inputs and create PR
        uses: actions/github-script@v6
        with:
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            // Read workflow_dispatch input properly
            const feature = context.payload.inputs.feature_branch;
            const base = "dev";

            // Validate input
            if (!feature || feature.trim() === "") {
              core.setFailed("ERROR: Input 'feature_branch' is empty.");
              return;
            }

            // Validate that branch exists
            try {
              await github.rest.repos.getBranch({ owner, repo, branch: feature });
            } catch (err) {
              core.setFailed(`ERROR: Branch '${feature}' does not exist in the repository.`);
              return;
            }

            // Compare feature vs dev
            const compare = await github.rest.repos.compareCommits({
              owner, repo,
              base: base,
              head: feature
            });

            const files = compare.files || [];
            const commits = compare.commits || [];

            if (files.length === 0 && commits.length === 0) {
              core.setFailed(`No differences found between '${base}' and '${feature}'.`);
              return;
            }

            const fileNames = files.slice(0, 200).map(f => f.filename);
            const commitMessages = commits.map(
              c => `- ${c.commit.message.split("\n")[0]} (${c.sha.substring(0,7)})`
            ).join("\n");

            const lastCommit = commits.length ? commits[commits.length - 1] : null;
            const commitSha = lastCommit ? lastCommit.sha : "(none)";

            const title = `Promote ${feature} → ${base}`;

            const body = [
              "**Automated Promotion PR**",
              "",
              `**Source branch:** ${feature}`,
              `**Target branch:** ${base}`,
              `**Changed files:** ${files.length}`,
              "",
              "### File list (first 200)",
              fileNames.join("\n"),
              "",
              "### Commit messages",
              commitMessages,
              "",
              `**Last commit SHA:** ${commitSha}`
            ].join("\n");

            // Create a PR
            const pr = await github.rest.pulls.create({
              owner,
              repo,
              base,
              head: feature,
              title,
              body
            });

            core.info(`Created PR #${pr.data.number}: ${pr.data.html_url}`);
