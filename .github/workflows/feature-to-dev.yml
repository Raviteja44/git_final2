name: 1. Promote feature → dev

on:
  workflow_dispatch:
    inputs:
      feature_branch:
        description: "Name of feature branch (example: feature/edp_changes_ravi)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (needed for compare API auth)
        uses: actions/checkout@v4

      - name: Validate and Create PR
        uses: actions/github-script@v6
        with:
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            const feature = context.payload.inputs.feature_branch.trim();
            const base = "dev";

            if (!feature) {
              core.setFailed("ERROR: Feature branch is empty.");
              return;
            }

            // 1️⃣ Validate branch exists
            try {
              await github.rest.repos.getBranch({ owner, repo, branch: feature });
            } catch (err) {
              core.setFailed(`ERROR: Branch '${feature}' does not exist.`);
              return;
            }

            // 2️⃣ Use merge-base safe comparison (handles diverged histories)
            const basehead = `${feature}...${base}`;

            const compare = await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              basehead
            });

            const files = compare.files || [];
            const commits = compare.commits || [];

            // 3️⃣ Filter: Only show commits unique to FEATURE branch
            const featureCommits = commits.filter(c => {
              return c.parents && c.parents.length === 1;   // not merge commits
            });

            if (files.length === 0 && featureCommits.length === 0) {
              core.setFailed(`❌ No differences found between '${feature}' and '${base}'.`);
              return;
            }

            const fileNames = files.map(f => f.filename);
            const commitMessages = featureCommits
              .map(c => `- ${c.commit.message.split("\n")[0]} (${c.sha.substring(0, 7)})`)
              .join("\n");

            // 4️⃣ PR title & body
            const title = `Promote ${feature} → ${base}`;

            const body = [
              "**Automated Promotion PR**",
              "",
              `**Source branch:** ${feature}`,
              `**Target branch:** ${base}`,
              "",
              `**Changed files:** ${files.length}`,
              "",
              "### File list",
              fileNames.join("\n"),
              "",
              "### Feature branch commit messages",
              commitMessages || "(none)",
            ].join("\n");

            // 5️⃣ Create PR
            const pr = await github.rest.pulls.create({
              owner,
              repo,
              base,
              head: feature,
              title,
              body
            });

            core.info(`Created PR #${pr.data.number}: ${pr.data.html_url}`);
