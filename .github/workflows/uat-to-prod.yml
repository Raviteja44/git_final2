name: 3. Promote uat → prod (by PR id)

on:
  workflow_dispatch:
    inputs:
      source_pr:
        description: 'PR number that merged dev → uat (e.g. 42)'
        required: true
        type: number
      temp_branch_prefix:
        description: 'Temp branch prefix (optional)'
        required: false
        default: 'temp/promote'
        type: string
      enable_auto_merge:
        description: 'Enable auto-merge when approvals satisfied? (true/false)'
        required: false
        default: 'true'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Create temp branch at last commit of source PR and open PR → prod
        uses: actions/github-script@v6
        id: create_pr
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = parseInt(core.getInput('source_pr'), 10);
            const prefix = core.getInput('temp_branch_prefix') || 'temp/promote';
            const enableAuto = core.getInput('enable_auto_merge') === 'true';

            // fetch commits of the source PR
            const commitsResp = await github.rest.pulls.listCommits({
              owner, repo, pull_number: prNumber,
              per_page: 300
            });

            if (!commitsResp.data || commitsResp.data.length === 0) {
              core.setFailed(`No commits found in PR #${prNumber}`);
              return;
            }

            const lastCommit = commitsResp.data[commitsResp.data.length - 1];
            const lastSha = lastCommit.sha;
            const sanitized = `promote-pr-${prNumber}`.replace(/[^a-zA-Z0-9-_./]/g, '-');
            const refName = `refs/heads/${prefix}/${sanitized}`;

            try {
              await github.rest.git.createRef({
                owner, repo,
                ref: refName,
                sha: lastSha
              });
            } catch (err) {
              if (err.status === 422) {
                await github.rest.git.updateRef({
                  owner, repo,
                  ref: refName.replace('refs/heads/', ''),
                  sha: lastSha,
                  force: true
                });
              } else {
                throw err;
              }
            }

            const base = 'prod';
            const head = `${prefix}/${sanitized}`;

            const compare = await github.rest.repos.compareCommits({
              owner, repo,
              base,
              head
            });

            const files = compare.files || [];
            const fileCount = files.length;
            const fileNames = files.slice(0,200).map(f => f.filename);
            const commitMessages = commitsResp.data.map(c => `- ${c.commit.message.split('\n')[0]} (${c.sha.substring(0,7)})`).join('\n');

            const title = `Promote ${head} → ${base} (PR #${prNumber})`;
            const body = [
              `**PR created by workflow**`,
              ``,
              `**Derived from source PR:** #${prNumber}`,
              `**Source last commit:** ${lastSha}`,
              `**Target branch:** ${base}`,
              `**Changes identified:** ${fileCount} files`,
              ``,
              `**Changed files (first 200):**`,
              fileNames.length ? fileNames.join('\n') : '(none)',
              ``,
              `**Commits from source PR:**`,
              commitMessages || '(none)',
            ].join('\n');

            const pr = await github.rest.pulls.create({
              owner, repo,
              head,
              base,
              title,
              body,
            });

            core.setOutput('pr_number', pr.data.number);
            core.setOutput('pr_url', pr.data.html_url);

            if (enableAuto) {
              try {
                await github.request('PUT /repos/{owner}/{repo}/pulls/{pull_number}/enable-auto-merge', {
                  owner, repo, pull_number: pr.data.number,
                  mediaType: { previews: ['luke-cage-preview'] },
                  merge_method: 'merge'
                });
                core.info('Auto-merge enabled on PR #' + pr.data.number);
              } catch (err) {
                core.warning('Failed to enable auto-merge: ' + err.message);
              }
            }
