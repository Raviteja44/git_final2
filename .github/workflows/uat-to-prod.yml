name: 3. UAT → Prod Promotion (manual)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number that was merged into uat (source PR to promote to prod)"
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Setup
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Checkout full repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify PR was merged into uat
        id: verify_pr
        run: |
          PR=${{ github.event.inputs.pr_number }}
          REPO="${{ github.repository }}"
          PR_JSON=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/$REPO/pulls/$PR")
          merged=$(echo "$PR_JSON" | jq -r .merged)
          base=$(echo "$PR_JSON" | jq -r .base.ref)
          if [ "$merged" != "true" ]; then
            echo "ERROR: PR #$PR is not merged. merged=$merged"
            exit 1
          fi
          if [ "$base" != "uat" ]; then
            echo "ERROR: PR #$PR base is '$base' but must be 'uat'."
            exit 1
          fi
          echo "$PR_JSON" > pr-$PR.json
          echo "ok=true" >> $GITHUB_OUTPUT

      - name: Get PR files & commits
        id: prfiles
        run: |
          PR=${{ github.event.inputs.pr_number }}
          REPO="${{ github.repository }}"
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/$REPO/pulls/$PR/files" > prfiles.json
          FILES=$(jq -r '.[].filename' prfiles.json | sed '/^$/d')
          COUNT=$(jq -r 'length' prfiles.json)
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/$REPO/pulls/$PR/commits" > prcommits.json
          LAST_MSG=$(jq -r '.[-1].commit.message' prcommits.json)
          COMMITS=$(jq -r '.[] | "\(.sha[0:7]) \(.commit.message)"' prcommits.json)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "last_msg<<EOF" >> $GITHUB_OUTPUT
          echo "$LAST_MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "commits<<'EOF'" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Fetch PR diff
        run: |
          PR=${{ github.event.inputs.pr_number }}
          REPO="${{ github.repository }}"
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3.diff" \
            "https://api.github.com/repos/$REPO/pulls/$PR" > pr-${PR}.diff

      - name: Create temporary branch from prod
        id: branch
        run: |
          TIMESTAMP=$(date +%s)
          PRNUM=${{ github.event.inputs.pr_number }}
          TMP="promote-pr-${PRNUM}-${TIMESTAMP}"
          git fetch origin prod --depth=1
          git checkout -b $TMP origin/prod
          git push origin $TMP
          echo "tmp_branch=$TMP" >> $GITHUB_OUTPUT

      - name: Apply diff onto tmp branch and push
        run: |
          PR=${{ github.event.inputs.pr_number }}
          TMP=${{ steps.branch.outputs.tmp_branch }}
          set -e
          git apply --index pr-${PR}.diff || (echo "git apply failed; there may be conflicts" && exit 1)
          git add -A
          LASTMSG="${{ steps.prfiles.outputs.last_msg }}"
          git commit -m "Promote PR #${PR} to prod" -m "${LASTMSG}"
          git push origin HEAD:${TMP}

      - name: Create PR into prod with rich body
        run: |
          PR=${{ github.event.inputs.pr_number }}
          TMP=${{ steps.branch.outputs.tmp_branch }}
          REPO="${{ github.repository }}"
          TITLE="Promote uat → prod PR ID#${PR}"
          BODY="PR ID: ${PR}\n\nThis PR promotes the changes (merged into uat) into prod.\n\nChanges identified: ${{ steps.prfiles.outputs.count }} file(s)\n\nFiles:\n$(echo \"${{ steps.prfiles.outputs.files }}\" | sed 's/^/ - /')\n\nCommit message (latest):\n${{ steps.prfiles.outputs.last_msg }}\n\nCommits:\n${{ steps.prfiles.outputs.commits }}\n\n(Reference: the PR number above describes what was tested in uat.)"
          PAYLOAD=$(jq -n --arg title "$TITLE" --arg head "$TMP" --arg base "prod" --arg body "$BODY" \
            '{title:$title, head:$head, base:$base, body:$body}')
          RESP=$(curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" -d "$PAYLOAD" "https://api.github.com/repos/$REPO/pulls")
          echo "create_resp: $RESP"
          echo "$RESP" | jq -r .html_url
